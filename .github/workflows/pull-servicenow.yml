name: Pull ServiceNow INC and RITM data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # daily 2:00 UTC

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Fetch incidents and RITMs from ServiceNow
        env:
          SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
        run: |
          curl -sS -u "$SN_USERNAME:$SN_PASSWORD" \
            --get "${SN_INSTANCE}/api/now/table/incident" \
            --data-urlencode "sysparm_limit=500" \
            --data-urlencode "sysparm_query=assignment_groupLIKEEAST" \
            --data-urlencode "sysparm_display_value=true" \
            --data-urlencode "sysparm_exclude_reference_link=true" \
            -o data/incidents.json

          curl -sS -u "$SN_USERNAME:$SN_PASSWORD" \
            --get "${SN_INSTANCE}/api/now/table/sc_req_item" \
            --data-urlencode "sysparm_limit=500" \
            --data-urlencode "sysparm_query=assignment_groupLIKEEAST" \
            --data-urlencode "sysparm_display_value=true" \
            --data-urlencode "sysparm_exclude_reference_link=true" \
            -o data/ritms.json

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/incidents.json data/ritms.json
          git commit -m "Auto-refresh ServiceNow incidents and RITMs" || echo "No changes"
          git push
``
