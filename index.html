<!DOCTYPE html>
<html>
<head>
  <title>EAST Team – ServiceNow Dashboard (INC + RITM)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1 { color: #2f5bea; }
    .cards { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 14px; min-width: 170px; background: #fafafa; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 28px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f0f0f0; }
  </style>
</head>

<body>

<h1>EAST Team – ServiceNow Dashboard (INC + RITM)</h1>

<div class="cards">
  <div class="card"><b>Total Tickets</b><br><span id="total">0</span></div>
  <div class="card"><b>Open</b><br><span id="open">0</span></div>
  <div class="card"><b>Closed</b><br><span id="closed">0</span></div>
</div>

<h2>Team Backlog</h2>
<table>
  <thead>
    <tr>
      <th>Team Member</th>
      <th>Open</th>
      <th>Closed</th>
    </tr>
  </thead>
  <tbody id="teamTable"></tbody>
</table>

<h2>Open Tickets (INC + RITM)</h2>
<table>
  <thead>
    <tr>
      <th>Ticket</th>
      <th>Type</th>
      <th>Assignment Group</th>
      <th>Assignee</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="openTickets"></tbody>
</table>

<script>
const TEAM = [
  "Chris Braga",
  "Christina Sunil",
  "Balaji Manikanta Sai Sadhu",
  "Digvijay Pawar",
  "Manognasri Chitrala",
  "Raleigh Turner",
  "Rachana Adiga",
  "Sreeja Janumpally"
];

const display = f => (f && typeof f === "object") ? (f.display_value ?? f.value ?? "") : (f ?? "");

const getNumber = r => r.number ?? "";
const getType = r => getNumber(r).startsWith("RITM") ? "RITM" : "INC";
const getGroup = r => display(r.assignment_group);
const getAssignee = r => display(r.assigned_to);
const getState = r => display(r.state) || display(r.request_state) || "";

const isClosed = r => {
  const s = getState(r).toLowerCase();
  return s.includes("closed") || s.includes("complete") || s.includes("resolved");
};

Promise.all([
  fetch("data/incidents.json").then(r => r.json()),
  fetch("data/ritms.json").then(r => r.json())
])
.then(([inc, ritm]) => {
  const all = [...(inc.result||[]), ...(ritm.result||[])];
  const open = all.filter(r => !isClosed(r));
  const closed = all.filter(isClosed);

  total.innerText = all.length;
  document.getElementById("open").innerText = open.length;
  document.getElementById("closed").innerText = closed.length;

  TEAM.forEach(name => {
    const o = open.filter(r => getAssignee(r) === name).length;
    const c = closed.filter(r => getAssignee(r) === name).length;
    teamTable.innerHTML += `<tr><td>${name}</td><td>${o}</td><td>${c}</td></tr>`;
  });

  open.forEach(r => {
    openTickets.innerHTML += `
      <tr>
        <td>${getNumber(r)}</td>
        <td>${getType(r)}</td>
        <td>${getGroup(r) || "-"}</td>
        <td>${getAssignee(r) || "Unassigned"}</td>
        <td>${getState(r)}</td>
      </tr>`;
  });
});
</script>

</body>
</html>
