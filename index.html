<!DOCTYPE html>
<html>
<head>
  <title>EAST Dashboard – Debug</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1 { color: #c0392b; }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    code { background: #f4f4f4; padding: 4px; display: block; margin-top: 6px; }
  </style>
</head>

<body>

<h1>ServiceNow Dashboard – DATA DEBUG</h1>

<div class="box">
  <b>Data load status:</b>
  <div id="status">Loading…</div>
</div>

<div class="box">
  <b>Total records loaded:</b>
  <div id="count">0</div>
</div>

<div class="box">
  <b>First 5 ticket numbers:</b>
  <div id="samples"></div>
</div>

<script>
fetch("data/incidents.json")
  .then(r => {
    document.getElementById("status").innerText = "✅ Fetch succeeded";
    return r.json();
  })
  .then(d => {
    const records = d.result || [];
    document.getElementById("count").innerText = records.length;

    if (records.length === 0) {
      document.getElementById("samples").innerText = "⚠️ result[] is empty";
      return;
    }

    records.slice(0,5).forEach(r => {
      const line = document.createElement("code");
      line.innerText =
        `${r.number} | ${r.assignment_group?.display_value || r.assignment_group || "NO GROUP"}`;
      document.getElementById("samples").appendChild(line);
    });
  })
  .catch(err => {
    document.getElementById("status").innerText = "❌ Fetch failed";
    document.getElementById("samples").innerText = err.toString();
  });
</script>

</body>
</html>
``
