<!DOCTYPE html>
<html>
<head>
  <title>EAST Team – ServiceNow Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1 { color: #2f5bea; }
    .cards { display: flex; gap: 16px; margin-bottom: 24px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 14px; min-width: 160px; background: #fafafa; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f0f0f0; }
  </style>
</head>

<body>

<h1>EAST Team – ServiceNow Dashboard</h1>

<div class="cards">
  <div class="card"><b>Total EAST Tickets</b><br><span id="total">0</span></div>
  <div class="card"><b>Open</b><br><span id="open">0</span></div>
  <div class="card"><b>Closed</b><br><span id="closed">0</span></div>
</div>

<h2>Team Backlog</h2>
<table>
  <thead>
    <tr>
      <th>Team Member</th>
      <th>Open</th>
      <th>Closed</th>
    </tr>
  </thead>
  <tbody id="teamTable"></tbody>
</table>

<h2>Open Tickets (EAST)</h2>
<table>
  <thead>
    <tr>
      <th>Ticket</th>
      <th>Assignment Group</th>
      <th>Assignee</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="openTickets"></tbody>
</table>

<script>
const TEAM = [
  "Chris Braga",
  "Christina Sunil",
  "Balaji Manikanta Sai Sadhu",
  "Digvijay Pawar",
  "Manognasri Chitrala",
  "Raleigh Turner",
  "Rachana Adiga",
  "Sreeja Janumpally"
];

fetch("data/incidents.json")
  .then(r => r.json())
  .then(d => {
    const records = d.result || [];

    const isClosed = r =>
      (r.state?.display_value || "").toLowerCase() === "closed";

    const openTickets = records.filter(r => !isClosed(r));
    const closedTickets = records.filter(isClosed);

    document.getElementById("total").innerText = records.length;
    document.getElementById("open").innerText = openTickets.length;
    document.getElementById("closed").innerText = closedTickets.length;

    const teamTable = document.getElementById("teamTable");

    TEAM.forEach(name => {
      const openCount = openTickets.filter(r =>
        r.assigned_to?.display_value === name
      ).length;

      const closedCount = closedTickets.filter(r =>
        r.assigned_to?.display_value === name
      ).length;

      teamTable.innerHTML += `
        <tr>
          <td>${name}</td>
          <td>${openCount}</td>
          <td>${closedCount}</td>
        </tr>
      `;
    });

    const openTbody = document.getElementById("openTickets");

    openTickets.forEach(r => {
      openTbody.innerHTML += `
        <tr>
          <td>${r.number}</td>
          <td>${r.assignment_group?.display_value || "-"}</td>
          <td>${r.assigned_to?.display_value || "Unassigned"}</td>
          <td>${r.state?.display_value || "-"}</td>
        </tr>
      `;
    });
  });
</script>

</body>
</html>
