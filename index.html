<!DOCTYPE html>
<html>
<head>
  <title>ServiceNow Operations Dashboard</title>

  <style>
    body { font-family: Arial, margin: 24px; }
    h1 { color: #2f5bea; }

    .cards {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .card {
      border: 1px solid #ccc;
      padding: 14px;
      border-radius: 8px;
      min-width: 150px;
      background: #f9f9f9;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 24px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th { background: #f0f0f0; }
  </style>
</head>

<body>

<h1>ServiceNow Operations Dashboard</h1>

<!-- Leadership summary -->
<div class="cards">
  <div class="card"><b>Incoming</b><br><span id="incoming">0</span></div>
  <div class="card"><b>Closed</b><br><span id="closed">0</span></div>
  <div class="card"><b>Backlog</b><br><span id="backlog">0</span></div>
</div>

<!-- Team-wise view -->
<h2>Team Backlog</h2>
<table>
  <thead>
    <tr>
      <th>Team Member</th>
      <th>Open</th>
      <th>Closed</th>
      <th>Avg Age (Days)</th>
    </tr>
  </thead>
  <tbody id="teamTable"></tbody>
</table>

<!-- Open tickets -->
<h2>Open Tickets</h2>
<table>
  <thead>
    <tr>
      <th>Ticket</th>
      <th>Assignee</th>
      <th>Status</th>
      <th>Age (Days)</th>
    </tr>
  </thead>
  <tbody id="openTickets"></tbody>
</table>

<script>
// ✅ Ticket types we care about
const ALLOWED_PREFIXES = ["INC", "RITM"];

// ✅ Exact ServiceNow display names
const TEAM = [
  "Chris Braga",
  "Christina Sunil",
  "Balaji Manikanta Sai Sadhu",
  "Digvijay Pawar",
  "Manognasri Chitrala",
  "Raleigh Turner",
  "Rachana Adiga",
  "Sreeja Janumpally"
];

fetch("data/incidents.json")
  .then(r => r.json())
  .then(d => {
    const now = new Date();
    const all = d.result || [];

    // ✅ Filter to: INC / RITM + your team only
    const data = all.filter(i => {
      const number = i.number || "";
      const assignee = i.assigned_to?.display_value || "";

      const validType = ALLOWED_PREFIXES.some(p => number.startsWith(p));
      const validPerson = TEAM.some(name =>
        assignee.toLowerCase() === name.toLowerCase()
      );

      return validType && validPerson;
    });

    const ageDays = i =>
      (now - new Date(i.opened_at || i.sys_created_on)) / 86400000;

    const isClosed = i =>
      i.state?.display_value?.toLowerCase() === "closed";

    const open = data.filter(i => !isClosed(i));
    const closed = data.filter(isClosed);

    // Summary cards
    document.getElementById("incoming").innerText = data.length;
    document.getElementById("closed").innerText = closed.length;
    document.getElementById("backlog").innerText = open.length;

    // Team table
    const tbody = document.getElementById("teamTable");

    TEAM.forEach(name => {
      const mine = data.filter(i =>
        i.assigned_to?.display_value?.toLowerCase() === name.toLowerCase()
      );

      const openCount = mine.filter(i => !isClosed(i)).length;
      const closedCount = mine.filter(isClosed).length;

      const avgAge =
        mine
          .filter(i => !isClosed(i))
          .reduce((a, i) => a + ageDays(i), 0) / (openCount || 1);

      tbody.innerHTML += `
        <tr>
          <td>${name}</td>
          <td>${openCount}</td>
          <td>${closedCount}</td>
          <td>${avgAge.toFixed(1)}</td>
        </tr>
      `;
    });

    // Open tickets table
    const ot = document.getElementById("openTickets");

    open.forEach(i => {
      ot.innerHTML += `
        <tr>
          <td>${i.number}</td>
          <td>${i.assigned_to.display_value}</td>
          <td>${i.state.display_value}</td>
          <td>${ageDays(i).toFixed(1)}</td>
        </tr>
      `;
    });
  });
</script>

</body>
</html>
``
